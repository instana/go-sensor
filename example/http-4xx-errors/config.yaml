# Instana tracer configuration for the http-4xx-errors example.
# Used via INSTANA_CONFIG_PATH — note the root key is "tracing:" (not "com.instana.tracing:").
# The "com.instana.tracing:" prefix is only for the agent's own configuration.yaml.
#
# Only 401 and 403 responses on exit HTTP spans are classified as errors.
# All other 4xx responses (e.g. 404) are NOT treated as errors.
#
# To mark every 4xx as an error instead, replace the block below with:
#   tracing:
#     http:
#       exit:
#         classify-all-4xx-as-errors: true

tracing:
  http:
    exit:
      classify-as-errors:
        - 401
        - 403
